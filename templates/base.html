<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Invoice App{% endblock %}</title>
    <link rel="stylesheet" href="https://unpkg.com/@knadh/oat/oat.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://unpkg.com/@knadh/oat/oat.min.js" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <span class="brand">Invoice App</span>
            <div class="menu">
                <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">Dashboard</a>
                <a href="{{ url_for('invoices') }}" class="{{ 'active' if request.endpoint in ['invoices', 'add_invoice', 'invoice_view', 'edit_invoice'] }}">Invoices</a>
                <a href="{{ url_for('customers') }}" class="{{ 'active' if request.endpoint in ['customers', 'add_customer', 'edit_customer'] }}">Customers</a>
                <a href="{{ url_for('items') }}" class="{{ 'active' if request.endpoint in ['items', 'add_item', 'edit_item'] }}">Items</a>
            </div>
        </div>
    </header>

    <div class="page">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
