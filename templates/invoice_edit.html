{% extends "base.html" %}

{% block title %}Edit {{ invoice.number }}{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Edit Invoice {{ invoice.number }}</h2>
</div>

<form method="post">
    <div class="form-narrow">
        <label>Customer
            <select name="customer_id" required>
                {% for c in customers %}
                <option value="{{ c.id }}" {{ "selected" if c.id == invoice.customer_id }}>{{ c.name }}</option>
                {% endfor %}
            </select>
        </label>

        <label>Date
            <input type="date" name="date" value="{{ invoice.date }}" required>
        </label>

        <label>Status
            <select name="status">
                <option {{ "selected" if invoice.status == "Unpaid" }}>Unpaid</option>
                <option {{ "selected" if invoice.status == "Paid" }}>Paid</option>
            </select>
        </label>
    </div>

    <h3>Line Items</h3>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Description</th>
                    <th style="width: 90px;">Qty</th>
                    <th style="width: 130px;">Price</th>
                    <th style="width: 90px;"></th>
                </tr>
            </thead>
            <tbody id="lines">
                {% for line in invoice.lines %}
                <tr>
                    <td><input type="text" name="description" value="{{ line.description }}" required></td>
                    <td><input type="number" name="quantity" value="{{ line.quantity }}" min="1" required></td>
                    <td><input type="number" name="price" value="{{ line.price }}" min="0" step="0.01" required></td>
                    <td><button type="button" class="secondary" onclick="this.closest('tr').remove()">Remove</button></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <p><button type="button" class="secondary" onclick="addLine()">+ Add Line</button></p>

    <div class="form-narrow">
        <label>Notes
            <textarea name="notes" rows="3" placeholder="Payment terms, thank-you note...">{{ invoice.notes }}</textarea>
        </label>
    </div>

    <div class="actions">
        <button type="submit">Save Invoice</button>
        <a href="{{ url_for('invoice_view', id=invoice.id) }}" class="button secondary">Cancel</a>
    </div>
</form>

<template id="line-template">
    <tr>
        <td><input type="text" name="description" required></td>
        <td><input type="number" name="quantity" value="1" min="1" required></td>
        <td><input type="number" name="price" value="0" min="0" step="0.01" required></td>
        <td><button type="button" class="secondary" onclick="this.closest('tr').remove()">Remove</button></td>
    </tr>
</template>

<script>
    function addLine() {
        const row = document.getElementById("line-template").content.cloneNode(true);
        document.getElementById("lines").appendChild(row);
    }
</script>
{% endblock %}
