{% extends "base.html" %}

{% block title %}Create Invoice{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Create Invoice</h2>
</div>

<form method="post">
    <div class="form-narrow">
        <label>Customer
            <select name="customer_id" required>
                <option value="">-- Choose customer --</option>
                {% for c in customers %}
                <option value="{{ c.id }}">{{ c.name }}</option>
                {% endfor %}
            </select>
        </label>

        <label>Date
            <input type="date" name="date" value="{{ today }}" required>
        </label>
    </div>

    <h3>Line Items</h3>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Description</th>
                    <th style="width: 90px;">Qty</th>
                    <th style="width: 130px;">Price</th>
                    <th style="width: 90px;"></th>
                </tr>
            </thead>
            <tbody id="lines"></tbody>
        </table>
    </div>

    <div class="actions">
        <button type="button" class="secondary" onclick="addLine()">+ Add Line</button>
        {% if items %}
        <select id="saved-item" style="max-width: 220px;">
            <option value="">Add from saved items...</option>
            {% for i in items %}
            <option value="{{ i.id }}" data-name="{{ i.name }}" data-price="{{ i.price }}">{{ i.name }}</option>
            {% endfor %}
        </select>
        {% endif %}
    </div>

    <div class="form-narrow" style="margin-top: 16px;">
        <label>Notes
            <textarea name="notes" rows="3" placeholder="Payment terms, thank-you note..."></textarea>
        </label>
    </div>

    <div class="actions">
        <button type="submit">Save Invoice</button>
        <a href="{{ url_for('invoices') }}" class="button secondary">Cancel</a>
    </div>
</form>

<script>
    function addLine(description = "", price = 0) {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td><input type="text" name="description" required></td>
            <td><input type="number" name="quantity" value="1" min="1" required></td>
            <td><input type="number" name="price" min="0" step="0.01" required></td>
            <td><button type="button" class="secondary" onclick="this.closest('tr').remove()">Remove</button></td>`;
        row.querySelector("[name=description]").value = description;
        row.querySelector("[name=price]").value = price;
        document.getElementById("lines").appendChild(row);
    }

    // start with one empty line
    addLine();

    // fill a line from a saved item
    const saved = document.getElementById("saved-item");
    if (saved) {
        saved.addEventListener("change", () => {
            const opt = saved.selectedOptions[0];
            if (opt.value) addLine(opt.dataset.name, opt.dataset.price);
            saved.value = "";
        });
    }
</script>
{% endblock %}
