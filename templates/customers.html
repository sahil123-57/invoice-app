{% extends 'base.html' %}
{% block content %}
<h2>Customer Registry</h2>

<p>
    <a href="{{ url_for('customer_form') }}">Add New Customer</a>
</p>

<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Billing Address</th>
        </tr>
    </thead>
    <tbody>
        {% for c in customers %}
        <tr>
            <td>{{ c.name }}</td>
            <td>{{ c.email }}</td>
            <td>{{ c.address }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
